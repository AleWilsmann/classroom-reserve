services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ../web:/var/www

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../web:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: classroom_reserve
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
